[package]
name = "zcode-pet"
version = "0.2.5"
description = "Desktop pet for ZCode"
edition = "2021"

[lib]
name = "zcode_pet_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "protocol-asset", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"
notify-debouncer-full = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync"] }
dirs = "5"
chrono = "0.4"
log = "0.4"
# 读 ZCode 会话索引（tasks-index.sqlite）取任务名；默认链接系统 sqlite3
rusqlite = "0.32"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
